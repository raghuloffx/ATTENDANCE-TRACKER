<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Attendance Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="home-container">
    <div class="app-title">
        <h1>ATTENDANCE TRACKER</h1>
        <p>Reset your login password</p>
    </div>

    <div class="login-card">
        <h2>Forgot Password</h2>
        <p class="login-info">Choose your account and set a new password.</p>

        <form action="/reset_password" method="POST">
            <label>Account Type</label>
            <select name="role" id="role" onchange="toggleFields()" required>
                <option value="">Select</option>
                <option value="admin">Admin</option>
                <option value="student">Student</option>
            </select>

            <div id="adminFields" style="display:none;">
                <label>Admin Username</label>
                <input type="text" name="username" placeholder="Enter admin username">
            </div>

            <div id="studentFields" style="display:none;">
                <label>Register Number</label>
                <input type="text" name="register_no" placeholder="Enter register number">
                <label>Student Name</label>
                <input type="text" name="name" placeholder="Enter student name">
            </div>

            <label>New Password</label>
            <input type="password" name="new_password" required placeholder="Enter new password">

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required placeholder="Confirm new password">

            <button type="submit">RESET PASSWORD</button>
        </form>

        <p class="switch-text"><a href="/">← Back to Login</a></p>
    </div>
</div>

<script>
function toggleFields(){
    const role=document.getElementById("role").value;
    document.getElementById("adminFields").style.display=role==="admin"?"block":"none";
    document.getElementById("studentFields").style.display=role==="student"?"block":"none";
}
</script>
</body>
</html>
